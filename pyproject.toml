[project]
name = "textkit"
version = "0.1.0"
description = "Tiny text utilities (test target for the AEP PoC)"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/textkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
